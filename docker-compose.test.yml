version: '2'
services:
  db:
    container_name: scinote_db_test
    image: postgres:15
    environment:
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=mysecretpassword"
    command: postgres -c max_locks_per_transaction=256

  web:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: scinote_web_test
    container_name: scinote_web_test
    stdin_open: true
    tty: true
    user: scinote
    depends_on:
      - db
    ports:
      - "3000:3000"
    command: >
      bash -c "bundle exec rails s -b 0.0.0.0"
    environment:
      - RAILS_ENV=test
